version: 2

project_name: spool

before:
  hooks:
    - go work sync

builds:
  - id: spl
    main: ./cmd/spl
    binary: spl
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/autonomous-bits/spool/internal/version.Version={{ .Version }}
      - -X github.com/autonomous-bits/spool/internal/version.Commit={{ .Commit }}
      - -X github.com/autonomous-bits/spool/internal/version.BuildDate={{ .Date }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    ids:
      - spl
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "^build:"
      - "^Bump "
  format: "* {{ .Message }} ({{ .SHA }})"

release:
  prerelease: auto
